name: Verify FontPin

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  portable-core:
    name: Core / ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wasm, wasm-gc, js]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: hustcer/setup-moonbit@v1.22
        with:
          version: 0.10.17+d971670cd
          core-version: 0.10.17+d971670cd
      - run: moon update
      - run: moon run checks/gate.mbtx -- ${{ matrix.target }} moon

  native:
    name: Native / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: hustcer/setup-moonbit@v1.22
        with:
          version: 0.10.17+d971670cd
          core-version: 0.10.17+d971670cd
      - run: moon update
      - run: moon run checks/gate.mbtx -- native moon

  fonttools-oracle:
    name: Independent fontTools differential
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: hustcer/setup-moonbit@v1.22
        with:
          version: 0.10.17+d971670cd
          core-version: 0.10.17+d971670cd
      - run: python -m pip install fonttools==4.67.0
      - run: moon update
      - run: moon run checks/embed_layout_fixture.mbtx -- python
      - run: moon fmt
      - run: git diff --exit-code -- src/layout_fixture_test.mbt
      - run: moon run checks/oracle.mbtx -- wasm moon python
      - run: moon run checks/oracle.mbtx -- wasm moon python fixtures/robotoslab/RobotoSlab.ttf
      - run: moon run checks/variation_oracle.mbtx -- wasm moon python
      - run: moon run checks/hints_oracle.mbtx -- wasm moon python
      - run: moon run checks/vertical_oracle.mbtx -- wasm moon python
      - run: moon run checks/vertical_oracle.mbtx -- wasm moon python fixtures/vertical/VVARProbe.ttx
      - run: moon run checks/vertical_oracle.mbtx -- wasm moon python fixtures/horizontal/HorizontalProbe.ttx
      - run: moon run checks/vertical_oracle.mbtx -- wasm moon python fixtures/composites/AttachmentProbe.ttx
      - run: moon run checks/names_oracle.mbtx -- wasm moon python
      - run: moon run checks/layout_oracle.mbtx -- wasm moon python
      - run: moon run checks/layout_oracle.mbtx -- wasm moon python fixtures/layout/ValueProbe.ttx
      - run: moon run checks/layout_oracle.mbtx -- wasm moon python fixtures/layout/AnchorProbe.ttx
      - run: moon run checks/layout_oracle.mbtx -- wasm moon python fixtures/layout/ContextProbe.ttx
      - run: moon run checks/layout_oracle.mbtx -- wasm moon python fixtures/layout/FeatureProbe.ttx
      - run: moon run checks/layout_oracle.mbtx -- wasm moon python fixtures/robotoslab/RobotoSlab.ttf
